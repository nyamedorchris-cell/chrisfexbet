<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CHRISFIXBET</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff}.header{background:#00b050;padding:12px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:20px}.balance{background:#000;padding:6px 12px;border-radius:20px;font-size:12px}.balance b{color:#00ff88}.nav{display:flex;overflow-x:auto;background:#1a1a1a;padding:8px;gap:8px}.nav button{background:#2a2a2a;border:none;color:#fff;padding:8px 16px;border-radius:20px}.nav button.active{background:#00b050}.match-card{background:#1e1e1e;margin:8px;border-radius:10px;padding:12px;border-left:4px solid #00b050}.league{font-size:11px;color:#aaa;margin-bottom:6px}.teams{display:flex;justify-content:space-between}.team{font-weight:bold;font-size:14px}.odds{display:flex;gap:6px;margin-top:10px}.odd{flex:1;background:#2a2a2a;padding:10px;text-align:center;border-radius:6px;cursor:pointer}.odd b{display:block;font-size:12px;color:#aaa}.odd span{font-weight:900;color:#ffcc00}.betslip{position:fixed;bottom:0;left:0;right:0;background:#1e1e1e;padding:12px;border-top:2px solid #00b050;border-radius:15px 15px 0 0}.bet-btn{width:100%;background:#00b050;color:#fff;border:none;padding:14px;border-radius:8px;font-weight:900;margin-top:8px}</style></head><body><div class="header"><div class="logo">CHRISFIXBET</div><div class="balance">Balance: <b>GHS 2500</b></div></div><div class="nav"><button class="active">Football</button><button>Basketball</button><button>Live</button><button>Jackpot</button></div><div style="padding:8px"><div class="match-card" onclick="addBet('Man City vs Arsenal','2.45')"><div class="league">Premier League - Today 19:45</div><div class="teams"><div class="team">Man City</div><div>VS</div><div class="team">Arsenal</div></div><div class="odds"><div class="odd"><b>1</b><span>2.45</span></div><div class=
